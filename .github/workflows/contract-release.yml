name: Contract release

# Publishes the immutable contract release from protected main after the
# `contract-release` environment approves it. The bundle itself is built and
# committed by the maintainer with scripts/build-contract-release.mjs, so the
# bytes that are reviewed in the pull request are the bytes that get published.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Contract version to release (must equal info.version)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: contract-release
  cancel-in-progress: false

env:
  REDOCLY_VERSION: "2.72.1"
  OASDIFF_VERSION: "1.35.0"

jobs:
  publish:
    name: Publish api-v${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: contract-release
    steps:
      # A skipped job reports success, so refuse any non-main ref explicitly
      # instead of guarding the whole job with `if:`.
      - name: Require protected main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Contract releases must run from refs/heads/main, got $GITHUB_REF."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Lint the description
        run: >
          npx --yes "@redocly/cli@${REDOCLY_VERSION}" lint
          --config docs/specs/api/redocly.yaml
          docs/specs/api/openapi.yaml

      - name: Install oasdiff
        run: |
          set -euo pipefail
          archive="oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/$archive"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/oasdiff" /usr/local/bin/oasdiff

      - name: Validate structure and references
        run: oasdiff validate --fail-on WARN docs/specs/api/openapi.yaml

      - name: Check the requested version matches the description
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          declared="$(awk '/^info:/{found=1; next} found && /^  version:/{print $2; exit} found && /^[^[:space:]]/{exit}' docs/specs/api/openapi.yaml)"
          if [ "$declared" != "$VERSION" ]; then
            echo "::error::Workflow version '$VERSION' does not match info.version '$declared'."
            exit 1
          fi

      # Verify the attestation tooling exists before publishing, because a
      # failure afterwards would leave a release in place that cannot be
      # repaired without a version bump.
      - name: Pre-flight release verification tooling
        run: gh release verify --help >/dev/null

      - name: Verify the reviewed bundle
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          release_dir="docs/specs/api/releases/api-v${VERSION}"
          bundle="$release_dir/shiftpatch-api-${VERSION}.tgz"
          test -f "$bundle" || {
            echo "::error::Missing bundle at $release_dir. Build it with scripts/build-contract-release.mjs and commit it first."
            exit 1
          }

          cd "$release_dir"
          sha256sum --check "shiftpatch-api-${VERSION}.tgz.sha256"
          cd "$GITHUB_WORKSPACE"

          mkdir -p "$RUNNER_TEMP/bundle"
          tar -xzf "$bundle" -C "$RUNNER_TEMP/bundle"

          # The released description must be byte-identical to the reviewed one.
          cmp "$RUNNER_TEMP/bundle/package/openapi.yaml" docs/specs/api/openapi.yaml
          cmp "$RUNNER_TEMP/bundle/package/manifest.json" "$release_dir/manifest.json"

          source_commit="$(jq -r '.sourceCommit' "$release_dir/manifest.json")"
          echo "$source_commit" | grep -Eq '^[0-9a-f]{40}$' || {
            echo "::error::manifest.sourceCommit is not a full 40-character SHA."
            exit 1
          }
          jq -e --arg v "$VERSION" '.contractVersion == $v' "$release_dir/manifest.json" >/dev/null
          jq -e '.workItems | length > 0' "$release_dir/manifest.json" >/dev/null

          # The description in the recorded commit must be the description being
          # released, and that commit must be in this branch's history.
          git merge-base --is-ancestor "$source_commit" "$GITHUB_SHA"
          git show "$source_commit:docs/specs/api/openapi.yaml" | cmp - docs/specs/api/openapi.yaml

      - name: Refuse to replace a published release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if gh release view "api-v${VERSION}" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::api-v${VERSION} already exists. Released contract versions are immutable; bump the version."
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/api-v${VERSION}" >/dev/null; then
            echo "::error::Tag api-v${VERSION} already exists; a tag without a release is ambiguous. Resolve it before retrying."
            exit 1
          fi

      - name: Create the draft release with every asset attached
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          release_dir="docs/specs/api/releases/api-v${VERSION}"
          gh release create "api-v${VERSION}" \
            "$release_dir/shiftpatch-api-${VERSION}.tgz" \
            "$release_dir/shiftpatch-api-${VERSION}.tgz.sha256" \
            "$release_dir/manifest.json" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "ShiftPatch API ${VERSION}" \
            --notes-file docs/specs/api/CHANGELOG.md \
            -R "$GITHUB_REPOSITORY"

      - name: Publish the immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release edit "api-v${VERSION}" --draft=false -R "$GITHUB_REPOSITORY"

      - name: Verify the published assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release verify "api-v${VERSION}" -R "$GITHUB_REPOSITORY"
          gh release verify-asset "api-v${VERSION}" \
            "docs/specs/api/releases/api-v${VERSION}/shiftpatch-api-${VERSION}.tgz" \
            -R "$GITHUB_REPOSITORY"
